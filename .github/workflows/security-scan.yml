name: BlueStrix Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BlueStrix
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"
          python -c "import bluestrix; print('BlueStrix', bluestrix.__version__)"
          python --version
          bluestrix --version || true

      - name: Show project structure
        run: |
          echo "Repository structure:"
          find . -maxdepth 3 \( -type f -o -type d \) | sort | head -200
          echo "---"
          ls -la config/ src/ scripts/ tests/ 2>/dev/null || true

      - name: Ensure reports directory
        run: mkdir -p reports

      - name: Validate configuration
        run: |
          CONFIG="config/bluestrix.example.yaml"
          if [ -f "$CONFIG" ]; then
            bluestrix --config "$CONFIG" policy validate || {
              echo "Policy validation returned non-zero (may be expected if policy files incomplete)"
            }
          else
            echo "config/bluestrix.example.yaml not found; skipping policy validation"
          fi

      - name: Run BlueStrix static scan
        run: |
          mkdir -p reports
          CONFIG="config/bluestrix.example.yaml"
          if [ ! -f "$CONFIG" ]; then
            echo "No config example found; skipping static scan"
            exit 0
          fi
          if [ -d ./src ]; then
            bluestrix --config "$CONFIG" scan code ./src --output reports/ci_scan || {
              echo "Static scan exited non-zero; continuing so reports can still be uploaded"
            }
          else
            echo "No ./src directory found; skipping static scan"
          fi

      - name: Run Slither
        run: |
          mkdir -p reports
          if [ -d ./contracts ]; then
            pip install slither-analyzer
            slither ./contracts --json - > reports/slither.json || true
          else
            echo "No ./contracts directory found; skipping Slither"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluestrix-reports
          path: reports/
          if-no-files-found: ignore
