name: Sandbox Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Repository structure:"
          find . -maxdepth 3 -type f | sort

      - name: Validate Docker Compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "docker-compose.yml not found; skipping validation"
          fi

      - name: Validate sandbox policy
        run: |
          if [ -f scripts/validate_sandbox.sh ]; then
            bash scripts/validate_sandbox.sh
          else
            echo "scripts/validate_sandbox.sh not found; skipping validation"
          fi

      - name: Run container scan
        run: |
          if [ -f scripts/run_container_scan.sh ]; then
            bash scripts/run_container_scan.sh ./tests/fixtures ./reports
          else
            echo "scripts/run_container_scan.sh not found; skipping container scan"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-reports
          path: reports/
          if-no-files-found: ignore
