[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluestrix"
version = "8.0.0"
description = "BlueStrix v8 - Defensive blockchain and Web3 security intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BlueStrix Project" }]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "email-validator>=2.0",
]

[project.optional-dependencies]
evm = ["web3>=6.20"]
solana = ["solana>=0.36", "solders>=0.21"]
slither = ["slither-analyzer>=0.10"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "email-validator>=2.0"]
database = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]
auth = [
  "argon2-cffi>=23.1",
  "bcrypt>=4.1",
  "redis>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "sqlalchemy>=2.0",
  "email-validator>=2.0",
]

[project.scripts]
bluestrix = "bluestrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
